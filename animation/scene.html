<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden;font-family:Inter,'DejaVu Sans',sans-serif}
  #stage{position:relative;width:1280px;height:720px;overflow:hidden}
  canvas{display:block}
  #ui{position:absolute;inset:0;pointer-events:none}
  #chyron{position:absolute;left:36px;top:30px;padding:6px 14px;background:rgba(0,0,0,.55);color:#fff;font-size:20px;letter-spacing:3px;font-weight:600;border-left:4px solid #ffb400;opacity:0}
  #cap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1000px;padding:12px 24px;background:rgba(0,0,0,.62);color:#fff;font-size:30px;line-height:1.25;text-align:center;border-radius:6px;opacity:0}
  #who{font-weight:800;letter-spacing:1px;margin-right:12px}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;opacity:0}
  #title .big{font-size:64px;font-weight:900;letter-spacing:4px;text-shadow:0 4px 30px rgba(0,0,0,.8)}
  #title .small{font-size:26px;margin-top:18px;letter-spacing:2px;opacity:.9}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}
  #fade{position:absolute;inset:0;background:#000;opacity:0}
</style>
</head>
<body>
<div id="stage">
<canvas id="c" width="1280" height="720"></canvas>
<div id="ui">
  <div id="chyron"></div>
  <div id="cap"><span id="who"></span><span id="txt"></span></div>
  <div id="title"><div class="big"></div><div class="small"></div></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>
</div>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';

// ---------- setup ----------
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1280, H = +q.get('h') || 720;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const uiScale = W / 1280;
document.getElementById('ui').style.transform = `scale(${uiScale})`;
document.getElementById('ui').style.transformOrigin = '0 0';
document.getElementById('ui').style.width = '1280px';
document.getElementById('ui').style.height = '720px';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W / H, 0.05, 3000);

// ---------- helpers ----------
const M = (c, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o));
const E = (c, e, i = 1) => new THREE.MeshLambertMaterial({ color: c, emissive: e, emissiveIntensity: i });
function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; }
function box(w, h, d, mat, x, y, z) { return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z); }
function cyl(rt, rb, h, mat, x, y, z, seg = 16) { return mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z); }
function sph(r, mat, x, y, z, seg = 16) { return mesh(new THREE.SphereGeometry(r, seg, Math.max(6, seg >> 1)), mat, x, y, z); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function kf(t, keys, ease = ss) {

  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return lerp(v0, v1, ease((t - t0) / (t1 - t0))); }

}
function kf3(t, keys, ease = ss) {
  const x = kf(t, keys.map(k => [k[0], k[1][0]]), ease), y = kf(t, keys.map(k => [k[0], k[1][1]]), ease), z = kf(t, keys.map(k => [k[0], k[1][2]]), ease);
  return new THREE.Vector3(x, y, z);
}
const lin = t => clamp(t, 0, 1);
function pulse(t, t0, up, down) { if (t < t0) return 0; if (t < t0 + up) return (t - t0) / up; if (t < t0 + up + down) return 1 - (t - t0 - up) / down; return 0; }
function seeded(n) { let s = n * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function camSet(pos, look, fov = 45) { camera.position.copy(pos); camera.lookAt(look); camera.fov = fov; camera.updateProjectionMatrix(); }
function shake(t, amp) { return new THREE.Vector3(Math.sin(t * 37.1) * amp + Math.sin(t * 61.3) * amp * .5, Math.cos(t * 43.7) * amp, Math.sin(t * 29.3) * amp * .3); }
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function skyDome(top, mid, bottom) {
  const tex = canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, top); gr.addColorStop(0.55, mid); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  const m = new THREE.Mesh(new THREE.SphereGeometry(1400, 24, 16), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false }));
  return m;
}
function stars(n, r) {
  const rnd = seeded(7); const pos = [];
  for (let i = 0; i < n; i++) { const th = rnd() * Math.PI * 2, ph = Math.acos(rnd() * 0.9); pos.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, fog: false }));
}

// ---------- characters ----------
function makePerson(o) {
  o = Object.assign({ skin: 0xf1c27d, top: 0x3355aa, sleeve: null, bottom: 0x222233, hair: 0x222222, hairStyle: 'short', shoes: 0x111111, pregnant: false, scale: 0.92, brow: 'flat', browColor: null, tie: null, cap: null, glasses: false, mustache: null, bignose: false, suspenders: null, longSleeve: false, lips: 0x7a3b3b, badge: false }, o);
  const skin = M(o.skin), top = M(o.top), sleeve = M(o.sleeve ?? o.top), bottom = M(o.bottom), hair = M(o.hair), shoes = M(o.shoes);
  const root = new THREE.Group(); root.scale.setScalar(o.scale);
  const P = { root, base: {} };
  root.add(box(0.34, 0.2, 0.22, bottom, 0, -0.02, 0));
  const torso = new THREE.Group(); root.add(torso); P.torso = torso;
  torso.add(mesh(new THREE.CapsuleGeometry(0.17, 0.32, 4, 12), top, 0, 0.32, 0));
  if (o.pregnant) torso.add(sph(0.2, top, 0, 0.17, 0.1));
  if (o.tie) torso.add(box(0.05, 0.3, 0.02, M(o.tie), 0, 0.33, 0.175));
  if (o.suspenders) for (const s of [-1, 1]) torso.add(box(0.035, 0.46, 0.015, M(o.suspenders), s * 0.08, 0.3, 0.175));
  if (o.badge) torso.add(box(0.06, 0.06, 0.01, E(0xffd700, 0xffd700, 0.6), 0.1, 0.42, 0.18));
  torso.add(cyl(0.05, 0.05, 0.1, skin, 0, 0.6, 0, 8));
  const head = new THREE.Group(); head.position.y = 0.64; torso.add(head); P.head = head;
  const hc = 0.15;
  head.add(sph(0.15, skin, 0, hc, 0, 20));
  for (const s of [-1, 1]) { head.add(sph(0.034, M(0xffffff), s * 0.055, hc + 0.02, 0.125, 10)); head.add(sph(0.015, M(0x111111), s * 0.055, hc + 0.02, 0.155, 8)); }
  const bc = M(o.browColor ?? o.hair);
  for (const s of [-1, 1]) { const b = box(0.07, 0.018, 0.02, bc, s * 0.055, hc + 0.075, 0.14); if (o.brow === 'angry') b.rotation.z = s * 0.45; if (o.brow === 'bushy') { b.scale.set(1.3, 2.2, 1.8); b.rotation.z = s * 0.25; } head.add(b); }
  const mouth = box(0.06, 0.012, 0.015, M(o.lips), 0, hc - 0.07, 0.14); head.add(mouth); P.mouth = mouth;
  if (o.bignose) { const n = mesh(new THREE.ConeGeometry(0.03, 0.09, 8), skin, 0, hc - 0.01, 0.17); n.rotation.x = Math.PI / 2; head.add(n); }
  else head.add(sph(0.025, skin, 0, hc - 0.01, 0.15, 8));
  if (o.hairStyle === 'short') head.add(mesh(new THREE.SphereGeometry(0.16, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0, hc + 0.01, 0));
  if (o.hairStyle === 'slick') { const h = mesh(new THREE.SphereGeometry(0.16, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0, hc + 0.01, -0.01); h.scale.set(1, 0.9, 1.05); head.add(h); }
  if (o.hairStyle === 'long') { head.add(mesh(new THREE.SphereGeometry(0.165, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hair, 0, hc + 0.01, 0)); head.add(cyl(0.15, 0.12, 0.38, hair, 0, hc - 0.12, -0.07, 12)); }
  if (o.hairStyle === 'bun') { head.add(mesh(new THREE.SphereGeometry(0.16, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0, hc + 0.01, 0)); head.add(sph(0.07, hair, 0, hc + 0.08, -0.14)); }
  if (o.hairStyle === 'tufts') { for (const s of [-1, 1]) { const t = sph(0.065, hair, s * 0.13, hc - 0.01, -0.03); t.scale.set(0.7, 1, 1.2); head.add(t); } head.add(sph(0.05, hair, 0, hc, -0.145)); }
  if (o.cap) { const capm = M(o.cap); head.add(cyl(0.175, 0.165, 0.07, capm, 0, hc + 0.12, -0.01)); const brim = box(0.2, 0.02, 0.12, capm, 0, hc + 0.09, 0.19); brim.rotation.x = 0.15; head.add(brim); }
  if (o.glasses) { const gm = M(0x1a1a1a); for (const s of [-1, 1]) head.add(mesh(new THREE.TorusGeometry(0.05, 0.009, 6, 18), gm, s * 0.058, hc + 0.02, 0.15)); head.add(box(0.03, 0.009, 0.009, gm, 0, hc + 0.025, 0.155)); for (const s of [-1, 1]) head.add(box(0.012, 0.009, 0.14, gm, s * 0.14, hc + 0.025, 0.08)); }
  if (o.mustache) head.add(box(0.1, 0.03, 0.035, M(o.mustache), 0, hc - 0.045, 0.15));
  P.arm = {};
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(s * 0.25, 0.55, 0); torso.add(sh);
    sh.add(sph(0.065, sleeve, 0, 0, 0, 10));
    sh.add(cyl(0.06, 0.05, 0.3, sleeve, 0, -0.15, 0, 10));
    const el = new THREE.Group(); el.position.y = -0.3; sh.add(el);
    el.add(cyl(0.05, 0.04, 0.28, o.longSleeve ? sleeve : skin, 0, -0.14, 0, 10));
    const hand = sph(0.055, skin, 0, -0.3, 0, 10); el.add(hand);
    P.arm[s < 0 ? 'L' : 'R'] = { sh, el, hand };
  }
  P.leg = {};
  for (const s of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(s * 0.1, -0.05, 0); root.add(hip);
    hip.add(cyl(0.085, 0.07, 0.45, bottom, 0, -0.225, 0, 10));
    const kn = new THREE.Group(); kn.position.y = -0.45; hip.add(kn);
    kn.add(cyl(0.065, 0.055, 0.45, bottom, 0, -0.225, 0, 10));
    kn.add(box(0.11, 0.07, 0.24, shoes, 0, -0.465, 0.05));
    P.leg[s < 0 ? 'L' : 'R'] = { hip, kn };
  }
  P.standY = 1.0 * o.scale;
  P.pose = (p) => {
    const q = Object.assign({}, P.base, p); const d = k => q[k] || 0;
    torso.rotation.set(d('tx'), d('ty'), d('tz')); head.rotation.set(d('hx'), d('hy'), d('hz'));
    P.arm.L.sh.rotation.set(d('lsx'), d('lsy'), d('lsz')); P.arm.L.el.rotation.set(d('lex'), 0, 0);
    P.arm.R.sh.rotation.set(d('rsx'), d('rsy'), d('rsz')); P.arm.R.el.rotation.set(d('rex'), 0, 0);
    P.leg.L.hip.rotation.set(d('lhx'), 0, d('lhz')); P.leg.L.kn.rotation.set(d('lkx'), 0, 0);
    P.leg.R.hip.rotation.set(d('rhx'), 0, d('rhz')); P.leg.R.kn.rotation.set(d('rkx'), 0, 0);

  };
  P.walkPose = (phase, amp, extra = {}) => {
    const s = Math.sin(phase);
    return Object.assign({ lhx: -amp * s, rhx: amp * s, lkx: amp * 1.2 * Math.max(0, s), rkx: amp * 1.2 * Math.max(0, -s), lsx: amp * 0.7 * s, rsx: -amp * 0.7 * s, lex: -0.3, rex: -0.3 }, extra);
  };
  P.place = (x, y, z, ry) => { root.position.set(x, y, z); root.rotation.set(0, ry, 0); };
  return P;
}
const SIT = { lhx: -1.5, rhx: -1.5, lkx: 1.5, rkx: 1.5, lsx: -0.4, rsx: -0.4, lex: -0.9, rex: -0.9 };
const STAND = { lex: -0.2, rex: -0.2 };
const talk = (t, on) => on ? 0.5 + 0.5 * Math.sin(t * 22) : 0;

// cast
const tommy = makePerson({ skin: 0xe8b894, top: 0x15152a, sleeve: 0x15152a, bottom: 0x15152a, hair: 0x120d0a, hairStyle: 'slick', brow: 'angry', tie: 0xaa1122, longSleeve: true, shoes: 0x0a0a0a, scale: 0.96 });
const woman = makePerson({ skin: 0xf3cba5, top: 0xf2a7c3, sleeve: 0xf2a7c3, bottom: 0x3a2e4a, hair: 0x4a2b16, hairStyle: 'long', pregnant: true, shoes: 0x7a5a3a, lips: 0xc0506a, scale: 0.86 });
const mother = makePerson({ skin: 0xe9c3a0, top: 0x0b0b10, sleeve: 0x0b0b10, bottom: 0x0b0b10, hair: 0x2a1a10, hairStyle: 'bun', brow: 'angry', longSleeve: true, lips: 0xb01030, shoes: 0x111111, scale: 0.9 });
const oldman = makePerson({ skin: 0xe6b89c, top: 0x8a5a2b, sleeve: 0x8a5a2b, bottom: 0x6d6d75, hair: 0xf0f0f0, hairStyle: 'tufts', brow: 'bushy', browColor: 0xf5f5f5, cap: 0x4a3a2a, glasses: true, mustache: 0xeeeeee, bignose: true, suspenders: 0x3a2a1a, longSleeve: true, shoes: 0x3a2a1a, scale: 0.84 });
oldman.base = { tx: -0.42, hx: 0.5, lkx: 0.35, rkx: 0.35, lhx: -0.2, rhx: -0.2, lhz: 0.12, rhz: -0.12, lsx: -0.3, rsx: -0.6, rex: -0.9, lex: -0.6 };
const pilot = makePerson({ skin: 0xd9a57a, top: 0xf4f4f4, sleeve: 0xf4f4f4, bottom: 0x1a1a2a, hair: 0x333333, cap: 0x101020, scale: 0.92 });
const copilot = makePerson({ skin: 0xf1c27d, top: 0xf4f4f4, sleeve: 0xf4f4f4, bottom: 0x1a1a2a, hair: 0x6a4a2a, cap: 0x101020, scale: 0.9 });
const guard1 = makePerson({ skin: 0x8d5a3b, top: 0x1b2a4a, sleeve: 0x1b2a4a, bottom: 0x1b2a4a, hair: 0x111111, cap: 0x1b2a4a, badge: true, longSleeve: true, scale: 0.98 });
const guard2 = makePerson({ skin: 0xf1c27d, top: 0x1b2a4a, sleeve: 0x1b2a4a, bottom: 0x1b2a4a, hair: 0x3a2a1a, cap: 0x1b2a4a, badge: true, longSleeve: true, scale: 0.96 });
const medic = makePerson({ skin: 0xc68642, top: 0x2d6cdf, sleeve: 0x2d6cdf, bottom: 0x1a1a3a, hair: 0x222222, hairStyle: 'short', scale: 0.9 });
const passengers = [];
{ const rnd = seeded(3); const cols = [0x556b2f, 0x8b0000, 0x2f4f4f, 0x6a5acd, 0xcd853f, 0x4682b4, 0x708090, 0xdaa520];
  for (let i = 0; i < 8; i++) passengers.push(makePerson({ skin: [0xf1c27d, 0x8d5a3b, 0xe0ac69, 0xc68642][i % 4], top: cols[i], bottom: 0x222233, hair: [0x111111, 0x5a3a1a, 0xaaaaaa, 0x2a1a10][i % 4], hairStyle: i % 3 === 1 ? 'long' : 'short', scale: 0.85 + rnd() * 0.1 })); }
// cane for old man (world-space object)
const cane = new THREE.Group();
{ const cm = M(0x5a3a1a); cane.add(cyl(0.018, 0.022, 0.9, cm, 0, -0.45, 0, 8)); const h = cyl(0.02, 0.02, 0.16, cm, 0.05, 0, 0, 8); h.rotation.z = Math.PI / 2; cane.add(h); cane.add(cyl(0.028, 0.028, 0.03, M(0x111111), 0, -0.9, 0, 8)); }
const _hp = new THREE.Vector3(), _down = new THREE.Vector3(0, -1, 0);
function placeCane(tipGround) {
  oldman.arm.R.hand.getWorldPosition(_hp); cane.position.copy(_hp);
  const dir = tipGround.clone().sub(_hp); const len = dir.length(); dir.normalize();
  cane.quaternion.setFromUnitVectors(_down, dir); cane.scale.set(1, len / 0.9, 1);
}

// ---------- plane model ----------
function makePlane() {
  const g = new THREE.Group();
  const white = M(0xf4f4f8), dark = M(0x1b1f2a), accent = M(0xc8102e), gold = M(0xd4af37);
  const fus = cyl(1, 1, 12, white, 0, 0, 0, 24); fus.rotation.x = Math.PI / 2; g.add(fus);
  const nose = sph(1, white, 0, 0, -6, 24); nose.scale.set(1, 1, 2.2); g.add(nose);
  const tail = cyl(1, 0.3, 5, white, 0, 0.15, 8.5, 24); tail.rotation.x = Math.PI / 2; tail.rotation.z = 0; g.add(tail);
  const fin = box(0.18, 3.6, 2.6, accent, 0, 2.2, 9.4); fin.rotation.x = -0.5; g.add(fin);
  for (const s of [-1, 1]) { const st = box(3.2, 0.1, 1.2, white, s * 1.6, 0.4, 9.8); st.rotation.y = s * 0.35; g.add(st); }
  for (const s of [-1, 1]) { const w = box(7.5, 0.16, 2.6, white, s * 4.2, -0.35, 1.2); w.rotation.y = -s * 0.4; w.rotation.z = s * 0.06; g.add(w);
    const e = cyl(0.55, 0.5, 2.2, dark, s * 3.3, -1.05, 1.0, 16); e.rotation.x = Math.PI / 2; g.add(e);
    const ei = cyl(0.5, 0.45, 0.4, gold, s * 3.3, -1.05, -0.1, 16); ei.rotation.x = Math.PI / 2; g.add(ei);
    g.add(sph(0.08, E(s < 0 ? 0xff0000 : 0x00ff00, s < 0 ? 0xff0000 : 0x00ff00, 2), s * 7.6, -0.35, 2.7, 6));
  }
  for (let i = 0; i < 18; i++) for (const s of [-1, 1]) g.add(box(0.05, 0.3, 0.26, dark, s * 1.0, 0.3, -4.4 + i * 0.6));
  const ck = box(2.2, 0.5, 0.9, dark, 0, 0.5, -6.6); ck.rotation.x = 0.4; g.add(ck);
  g.add(box(0.05, 0.3, 9, accent, 1.0, -0.2, 1)); g.add(box(0.05, 0.3, 9, accent, -1.0, -0.2, 1));
  const logo = mesh(new THREE.PlaneGeometry(2.4, 0.6), new THREE.MeshBasicMaterial({ map: canvasTex(256, 64, (c, w, h) => { c.fillStyle = '#0000'; c.clearRect(0, 0, w, h); c.font = 'bold 48px Inter, sans-serif'; c.fillStyle = '#d4af37'; c.textAlign = 'center'; c.fillText('HALE AIR', w / 2, 48); }), transparent: true }), 1.02, 0.15, 6.5); logo.rotation.y = Math.PI / 2; g.add(logo);
  const logo2 = logo.clone(); logo2.position.x = -1.02; logo2.rotation.y = -Math.PI / 2; g.add(logo2);
  const gear = new THREE.Group(); g.add(gear); g.gear = gear;
  const tire = M(0x111111);
  for (const [x, z] of [[0, -4.8], [-1.6, 1.4], [1.6, 1.4]]) { gear.add(cyl(0.06, 0.06, 1.4, dark, x, -1.4, z, 8)); const t = cyl(0.3, 0.3, 0.3, tire, x, -2.0, z, 12); t.rotation.z = Math.PI / 2; gear.add(t); }
  const strobe = sph(0.1, E(0xffffff, 0xffffff, 3), 0, -1.05, 1.5, 6); g.add(strobe); g.strobe = strobe;
  return g;
}

// ---------- cloud ----------
function makeCloud(rnd, scale) {
  const g = new THREE.Group(); const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const n = 4 + Math.floor(rnd() * 4);
  for (let i = 0; i < n; i++) { const s = sph(scale * (0.5 + rnd() * 0.6), m, (rnd() - 0.5) * scale * 2.4, (rnd() - 0.5) * scale * 0.5, (rnd() - 0.5) * scale * 1.4, 10); s.castShadow = false; s.receiveShadow = false; g.add(s); }
  return g;
}

// ---------- SETS ----------
const sets = {};
function newSet(name) { const g = new THREE.Group(); g.visible = false; scene.add(g); sets[name] = g; return g; }

// EXT (cruise + title)
